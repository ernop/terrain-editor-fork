# Rule: no-script-parent-chain
# Detect overly long script.Parent chains which are fragile
#
# Long chains like script.Parent.Parent.Parent.Parent are:
# - Hard to read
# - Break when structure changes
# - Should use FindFirstAncestor or explicit references
#
# Fix: Use script:FindFirstAncestor("ModuleName") instead

id: no-long-parent-chain
language: lua
severity: warning
message: "Long Parent chain is fragile. Use FindFirstAncestor instead."
note: "Use script:FindFirstAncestor('Name') to find ancestor by name."
rule:
  pattern: $X.Parent.Parent.Parent.Parent

