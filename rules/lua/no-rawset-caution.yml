# Rule: no-rawset-caution
# Detect rawset which may indicate questionable metatable bypassing
#
# While not always wrong, this often indicates:
# - Attempting to bypass Roblox security
# - Working around bugs that should be fixed properly
# - Unnecessary complexity

id: no-rawset-caution
language: lua
severity: hint
message: "rawset() bypasses metatables. Ensure this is intentional."
note: "rawset is sometimes necessary for metatable implementations but should be rare in application code."
rule:
  pattern: rawset($$$ARGS)

